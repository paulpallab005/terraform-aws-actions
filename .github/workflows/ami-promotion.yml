name: Promote AMI
on: 
    workflow_dispatch:
        inputs:
            component:
                description: 'AMI Name'
                required: true
                type: choice
                options:
                  - ds-db
                  - ds-cts
                  - ds-config
                  - openam
                  - openidm
                  - springboot
            aws_env:
                description: 'Environment promotion'
                required: true
                type: choice
                options:
                - dev > test
                - test > stage
                - stage > ppe
            deployment:
                description: 'Deployment color (e.g. blue > blue)'
                required: false
                type: choice
                options:
                - blue > blue
                - blue > green
                - green > blue
                - green > green

permissions:
  contents: write
  id-token: write

jobs:
  promote-ami:
    runs-on: ubuntu-latest
    name: "Promote AMI"

    steps:
        # - name: Install dependencies
        #   run: |
        #     apk add --no-cache bash jq git aws-cli

        - name: Summarize inputs in GitHub Step Summary
          run: |
            echo "## AMI Promotion inputs Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|--------|" >> $GITHUB_STEP_SUMMARY
            echo "| AMI Name | ${{ github.event.inputs.component }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Environment Promotion | ${{ github.event.inputs.aws_env }} |" >> $GITHUB_STEP_SUMMARY
            if [[ "${{ github.event.inputs.component }}" != "ds-db" || "${{ github.event.inputs.component }}" != "ds-cts" ]]; then
                echo "| Deployment Type | ${{ github.event.inputs.deployment }} |" >> $GITHUB_STEP_SUMMARY
            fi

        - name: Verify inputs
          if: github.event.inputs.aws_env == 'dev > test'
          run: |
            if [[ "${{ github.event.inputs.deployment }}" != "blue > blue" ]]; then
                echo "Invalid deployment for DEV > TEST promotion. Must be blue > blue."
                exit 1
            else
                echo "Inputs are valid for DEV > TEST promotion."
            fi