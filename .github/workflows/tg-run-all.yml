            echo "Starting Terragrunt Apply for all Web Apps...\n working-directory: ${{ needs.validate-details.outputs.aws_acc }}/${{ matrix.region }}/${{ inputs.environment }}/${{ inputs.deployment }}/autoscaling/${{ inputs.app_name }}"