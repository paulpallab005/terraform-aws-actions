  terragrunt_plan_all:
    if: ${{ inputs.region == 'all-regions' }}
    needs: validate-details
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.validate-details.outputs.matrix) }}
    steps:
        - name: Checkout repository
          uses: actions/checkout@v5
        
        - name: Set up Terraform
          uses: hashicorp/setup-terraform@v3
          with:
            terraform_version: ${{ needs.validate-details.outputs.tf_version }}

        - name: Set up Terragrunt
          shell: bash
          run: |
            TG_VERSION="${{ needs.validate-details.outputs.tg_version }}"
            
            echo "Installing Terragrunt ${TG_VERSION}..."
            
            # Download Terragrunt
            TG_URL="https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64"
            
            wget -q "${TG_URL}" -O /tmp/terragrunt
            
            # Make executable and move to PATH
            chmod +x /tmp/terragrunt
            mv /tmp/terragrunt /usr/local/bin/terragrunt
            
            echo "Terragrunt ${TG_VERSION} installed successfully"
            terragrunt --version

        - name: Terragrunt Plan
          run: |
            echo "Starting Terragrunt Plan for all Web Apps... \nworking-directory: ${{ needs.validate-details.outputs.aws_acc }}/${{ matrix.region }}/${{ inputs.environment }}/${{ inputs.deployment }}/autoscaling/${{ inputs.app_name }}"

  terragrunt_apply_all:
    needs: [validate-details, terragrunt_plan_all]
    runs-on: ubuntu-latest
    strategy:
